<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedijske komunikacije</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="stil.css">
</head>
<body>
    <h1>Lana Hutinski</h1>
	<h2>Interakcijski elementi:</h2>
	<div class="container">
		<button class="gumb">GUMB</button>
        <div class="kartica1">
            TRANSFORM KARTICA 1
        </div>
		<div class="kartica2">
            TRANSFORM KARTICA 2
        </div>
    </div>
	<h2>Animacije:</h2>
	<section id="tema">
        <div class="krug">1</div>
        <div class="krug">2</div>
        <div class="krug izdvojeno">3</div>
        <div class="krug">4</div>
        <div class="krug">5</div>
    </section>
	<h2>3D animacija:</h2>
	<div id="scena">
    <div class="sfera">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="circle c5"></div>
        <div class="circle c6"></div>
		<div class="circle c7"></div>
		<div class="circle c8"></div>
		<div class="circle c9"></div>
		<div class="circle c10"></div>
		<div class="circle c11"></div>
		<div class="circle c12"></div>
    </div>    
    </div>
</div>
</body>
</html>
